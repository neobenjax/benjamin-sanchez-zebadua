<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dynamic Theme Gradients & Glow Filters -->
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.15" />
      <stop offset="50%" stop-color="var(--color-accent)" stop-opacity="0.03" />
      <stop offset="100%" stop-color="var(--color-text-primary)" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-surface)" stop-opacity="0.9" />
      <stop offset="100%" stop-color="var(--color-secondary-bg)" stop-opacity="0.75" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Blueprint Grid -->
  <rect width="1000" height="480" rx="16" fill="url(#grid-grad)" stroke="var(--border-subtle)" stroke-width="1.5" />
  
  <g opacity="0.15" stroke="var(--color-text-secondary)" stroke-width="0.75" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="360" x2="1000" y2="360" />
  </g>

  <!-- Glowing Wireframe Connecting Pipelines -->
  <!-- Pipeline 1: Requirements to Core Architecture -->
  <path d="M 230 240 L 380 240" stroke="var(--color-accent)" stroke-width="2.5" stroke-dasharray="6 6" filter="url(#glow)" />
  <circle cx="305" cy="240" r="4" fill="var(--color-accent)" filter="url(#glow)" />

  <!-- Pipeline 2: Core Architecture to Guardrails -->
  <path d="M 620 240 L 770 160" stroke="var(--color-accent)" stroke-width="2.5" stroke-dasharray="6 6" filter="url(#glow)" />
  <circle cx="695" cy="200" r="4" fill="var(--color-accent)" filter="url(#glow)" />

  <!-- Pipeline 3: Core Architecture to Security -->
  <path d="M 620 240 L 770 320" stroke="var(--color-accent)" stroke-width="2.5" stroke-dasharray="6 6" filter="url(#glow)" />
  <circle cx="695" cy="280" r="4" fill="var(--color-accent)" filter="url(#glow)" />

  <!-- NODE 1: REQUIREMENTS & STRATEGY -->
  <g transform="translate(50, 170)">
    <rect width="180" height="140" rx="12" fill="url(#card-grad)" stroke="var(--border-subtle)" stroke-width="1.5" />
    <rect width="180" height="140" rx="12" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Icon: Requirements File & Check -->
    <rect x="24" y="24" width="36" height="36" rx="8" fill="var(--color-accent)" fill-opacity="0.12" stroke="var(--color-accent)" stroke-width="1.5" />
    <path d="M 36 36 L 42 42 L 52 30" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="24" y="85" fill="var(--color-text-primary)" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">REQUIREMENTS</text>
    <text x="24" y="105" fill="var(--color-text-secondary)" font-family="sans-serif" font-size="11" font-weight="500">Business &amp; Domain Specs</text>
  </g>

  <!-- NODE 2: CORE CODE & SYSTEM ARCHITECTURE (CENTERPIECE) -->
  <g transform="translate(380, 130)">
    <rect width="240" height="220" rx="16" fill="url(#card-grad)" stroke="var(--color-accent)" stroke-width="2" filter="url(#glow)" />
    
    <!-- Header Chip -->
    <rect x="20" y="20" width="200" height="32" rx="6" fill="var(--color-accent)" fill-opacity="0.1" />
    <circle cx="36" cy="36" r="4" fill="#ff5f56" />
    <circle cx="50" cy="36" r="4" fill="#ffbd2e" />
    <circle cx="64" cy="36" r="4" fill="#27c93f" />
    <text x="80" y="41" fill="var(--color-accent)" font-family="monospace" font-size="11" font-weight="700">CORE ARCHITECTURE</text>

    <!-- Code Wireframe Lines -->
    <g transform="translate(24, 70)" font-family="monospace" font-size="11">
      <text x="0" y="15" fill="var(--color-accent)" font-weight="700">&lt;SystemEngine&gt;</text>
      <text x="12" y="35" fill="var(--color-text-secondary)">const paradigm = &quot;Agnostic&quot;;</text>
      <text x="12" y="55" fill="var(--color-text-secondary)">const latency = &quot;&lt;1ms&quot;;</text>
      <text x="12" y="75" fill="var(--color-accent)">const status = &quot;Deterministic&quot;;</text>
      <text x="0" y="95" fill="var(--color-accent)" font-weight="700">&lt;/SystemEngine&gt;</text>
    </g>
  </g>

  <!-- NODE 3: GUARDRAILS & GOVERNANCE -->
  <g transform="translate(770, 90)">
    <rect width="180" height="130" rx="12" fill="url(#card-grad)" stroke="var(--border-subtle)" stroke-width="1.5" />
    <rect width="180" height="130" rx="12" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-opacity="0.3" />

    <!-- Icon: Shield / Guardrails -->
    <rect x="24" y="20" width="36" height="36" rx="8" fill="var(--color-accent)" fill-opacity="0.12" stroke="var(--color-accent)" stroke-width="1.5" />
    <path d="M 42 28 L 52 32 V 42 C 52 47 42 51 42 51 C 42 51 32 47 32 42 V 32 L 42 28 Z" stroke="var(--color-accent)" stroke-width="1.5" fill="none" />

    <text x="24" y="80" fill="var(--color-text-primary)" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">GUARDRAILS</text>
    <text x="24" y="100" fill="var(--color-text-secondary)" font-family="sans-serif" font-size="11" font-weight="500">WCAG AA &amp; Risk Rules</text>
  </g>

  <!-- NODE 4: FINTECH SECURITY & VAULT -->
  <g transform="translate(770, 260)">
    <rect width="180" height="130" rx="12" fill="url(#card-grad)" stroke="var(--border-subtle)" stroke-width="1.5" />
    <rect width="180" height="130" rx="12" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-opacity="0.3" />

    <!-- Icon: Lock / Security -->
    <rect x="24" y="20" width="36" height="36" rx="8" fill="var(--color-accent)" fill-opacity="0.12" stroke="var(--color-accent)" stroke-width="1.5" />
    <rect x="36" y="38" width="12" height="10" rx="2" stroke="var(--color-accent)" stroke-width="1.5" fill="none" />
    <path d="M 39 38 V 33 C 39 30 45 30 45 33 V 38" stroke="var(--color-accent)" stroke-width="1.5" fill="none" />

    <text x="24" y="80" fill="var(--color-text-primary)" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">SECURITY</text>
    <text x="24" y="100" fill="var(--color-text-secondary)" font-family="sans-serif" font-size="11" font-weight="500">Vault &amp; Cryptographic</text>
  </g>
</svg>
